spring.application.name=baozi-store
server.port=8080
server.error.include-message=always

# ===== Banco H2 (arquivo local - dados persistem entre execucoes) =====
spring.datasource.url=jdbc:h2:file:./data/baozidb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ===== Para usar MySQL: comente o bloco H2 acima e descomente este =====
# spring.datasource.url=jdbc:mysql://localhost:3306/baozi_store?createDatabaseIfNotExist=true&serverTimezone=America/Sao_Paulo
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.datasource.username=root
# spring.datasource.password=SUA_SENHA

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
